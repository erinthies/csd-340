<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSD 340 Web Development with HTML and CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            margin-top: 30px;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .gallery img {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        #messageBox {
            margin-top: 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>Assignment 10.3: JavaScript - Part 2</h1>

    <p>Click an image to change the message below.</p>

    <div class="gallery">
        <img src="image1.jpg" alt="Image 1" onclick="showMessage('You clicked the first image! This is a fun cozy game that I like to play in my spare time.')">
        <img src="image2.jpg" alt="Image 2" onclick="showMessage('Nice choice — that’s the second image! This is my favorite cozy game of all time.')">
        <img src="image3.jpg" alt="Image 3" onclick="showMessage('This is the third image you selected! This is the most recent cozy game I have played.')">
    </div>

    <div id="messageBox">Click an image to display a message.</div>

    <script>
        function showMessage(text) {
            document.getElementById("messageBox").innerHTML = text;
        }
    </script>

</body>
</html>
