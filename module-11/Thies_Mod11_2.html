<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSD 340 Web Development with HTML and CSS</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="Thies_Mod11_2.css">
</head>


    <h1>Assignment 11.2: JavaScript - Part 3</h1>

    <div class="container">
        <input type="text" id="userInput" placeholder="Enter a task">
        <button onclick="addItem()">Add</button>
        <button onclick="deleteLast()">Delete Last Entry</button>
        <button onclick="sortItems()">Sort</button>
    </div>

    <h2>Things To Do</h2>
    <ul id="outputList"></ul>

    <script>
        let items = [];

        function addItem() {
            let value = document.getElementById("userInput").value.trim();

            if (value !== "") {
                items.push(value);
                alert("Added: " + value);
                document.getElementById("userInput").value = "";
                displayItems();
            }
        }

        function deleteLast() {
            if (items.length > 0) {
                let removed = items.pop();
                alert("Deleted: " + removed);
                displayItems();
            } else {
                alert("There is nothing to delete.");
            }
        }

        function sortItems() {
            if (items.length > 0) {
                items.sort();
                alert("The list has been sorted.");
                displayItems();
            } else {
                alert("There is nothing to sort.");
            }
        }

        function displayItems() {
            let list = document.getElementById("outputList");
            list.innerHTML = "";

            for (let i = 0; i < items.length; i++) {
                let li = document.createElement("li");
                li.textContent = items[i];
                list.appendChild(li);
            }
        }
    </script>

</body>
</html>
